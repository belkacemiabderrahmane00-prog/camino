; CAMINO — limites d'upload (photos de téléphone) et mémoire pour le redimensionnement GD
upload_max_filesize = 12M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 60
; Fichiers temporaires d'upload dans un dossier garanti inscriptible par www-data
upload_tmp_dir = /var/www/html/storage/app/tmp
sys_temp_dir = /var/www/html/storage/app/tmp
